<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="ikeaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0b132b" />
    </linearGradient>
    <linearGradient id="ikeaYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcc00" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="ikeaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0058a3" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="cardGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#ikeaBg)" />

  <!-- Modern Web Dashboard Mockup -->
  <g transform="translate(60, 70)">
    <!-- Browser/App Window Frame -->
    <rect width="480" height="250" rx="12" fill="#0f172a" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    
    <!-- Top Window Bar -->
    <rect width="480" height="36" rx="12" fill="#1e293b" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#10b981" />
    <rect x="120" y="9" width="240" height="18" rx="6" fill="#0f172a" />
    <text x="175" y="22" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">ikea.internal/portal-v2</text>

    <!-- Sidebar -->
    <rect x="0" y="36" width="90" height="214" fill="#131e32" />
    <rect x="15" y="55" width="60" height="8" rx="4" fill="#38bdf8" opacity="0.8" />
    <rect x="15" y="75" width="50" height="6" rx="3" fill="#64748b" opacity="0.5" />
    <rect x="15" y="95" width="55" height="6" rx="3" fill="#64748b" opacity="0.5" />
    <rect x="15" y="115" width="45" height="6" rx="3" fill="#64748b" opacity="0.5" />

    <!-- Main Content Area -->
    <!-- Metric Cards -->
    <g transform="translate(110, 55)">
      <rect width="110" height="60" rx="8" fill="#1e293b" stroke="rgba(255,204,0,0.4)" stroke-width="1" />
      <text x="12" y="22" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Prestanda</text>
      <text x="12" y="45" font-family="'Outfit', sans-serif" font-weight="700" font-size="18" fill="#ffcc00">99.4%</text>

      <rect x="125" y="0" width="110" height="60" rx="8" fill="#1e293b" stroke="rgba(56,189,248,0.4)" stroke-width="1" />
      <text x="137" y="22" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Aktiva Moduler</text>
      <text x="137" y="45" font-family="'Outfit', sans-serif" font-weight="700" font-size="18" fill="#38bdf8">24 / 24</text>

      <rect x="250" y="0" width="105" height="60" rx="8" fill="#1e293b" stroke="rgba(16,185,129,0.4)" stroke-width="1" />
      <text x="262" y="22" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Tillgänglighet</text>
      <text x="262" y="45" font-family="'Outfit', sans-serif" font-weight="700" font-size="18" fill="#10b981">WCAG 2.1</text>
    </g>

    <!-- Data Table / Graph Prototype Area -->
    <g transform="translate(110, 130)">
      <rect width="355" height="105" rx="8" fill="#162035" />
      <!-- Table rows placeholder -->
      <rect x="15" y="15" width="325" height="12" rx="4" fill="#1e293b" />
      <rect x="15" y="37" width="325" height="12" rx="4" fill="#1e293b" opacity="0.7" />
      <rect x="15" y="59" width="325" height="12" rx="4" fill="#1e293b" opacity="0.5" />
      <rect x="15" y="81" width="325" height="12" rx="4" fill="#1e293b" opacity="0.3" />
      <circle cx="30" cy="21" r="3" fill="#ffcc00" />
      <circle cx="30" cy="43" r="3" fill="#38bdf8" />
      <circle cx="30" cy="65" r="3" fill="#10b981" />
    </g>
  </g>

  <!-- Top Left Pill Badge -->
  <g transform="translate(30, 25)">
    <rect width="180" height="28" rx="14" fill="rgba(245, 158, 11, 0.2)" stroke="rgba(245, 158, 11, 0.5)" />
    <text x="18" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#fbbf24">🏢 IKEA INTERNAL REDESIGN</text>
  </g>
</svg>
